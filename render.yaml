services:
  - type: web
    name: huddle-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: TEST_CLIENT_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_CURRENCY
        value: INR
      - key: CURRENCY_SYMBOL
        value: ₹
      - key: CLUB_UPI_ID
        value: yourclub@upi
      - key: CLUB_NAME
        value: Your Club

  - type: web
    name: huddle-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: huddle-backend
          envVarKey: RENDER_EXTERNAL_URL
